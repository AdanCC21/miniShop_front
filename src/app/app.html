@if (!isBarePage()) {
<div class="flex min-h-screen bg-(--surface)" [style.--sidebar-width]="sidebarWidth() + 'vw'">
  <app-sidebar [open]="sidebarOpen()" (close)="closeSidebar()" (widthChange)="onSidebarWidthChange($event)" />

  <div class="flex min-h-screen flex-1 flex-col md:pl-(--sidebar-width)">
    <app-header (menuClick)="openSidebar()" />

    <main class="flex-1 bg-(--surface) p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
} @else {
<router-outlet />
}

<app-toast />
<app-loader />
