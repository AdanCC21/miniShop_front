<header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-gray-200 bg-(--card) px-4 sm:px-6">
  <div class="flex items-center gap-3">
    <app-button ariaLabel="Abrir menú" variant="ghost" extraClass="!rounded-md !p-2 text-gray-500 hover:bg-gray-100 hover:text-black md:hidden"
      (clicked)="menuClick.emit()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </app-button>
    <span class="text-lg font-semibold text-black">miniShop</span>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-lg font-medium">{{this.shopName()}}</span>
    <app-theme-toggle />
  </div>
</header>
