@if (toasts().length > 0) {
  <div class="pointer-events-none fixed right-4 top-4 z-100 flex w-full max-w-xs flex-col gap-2">
    @for (toast of toasts(); track toast.id) {
      <div
        role="status"
        class="ms-toast-in pointer-events-auto flex items-start gap-3 rounded-lg border p-3 shadow-lg {{ borderClasses[toast.variant] }}"
      >
        <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-white {{ iconClasses[toast.variant] }}">
          @switch (toast.variant) {
            @case ('success') {
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5" />
              </svg>
            }
            @case ('error') {
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18 6L6 18M6 6l12 12" />
              </svg>
            }
            @case ('warning') {
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4M12 17h.01" />
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
              </svg>
            }
            @default {
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10" />
                <path stroke-linecap="round" d="M12 16v-4M12 8h.01" />
              </svg>
            }
          }
        </span>

        <div class="min-w-0 flex-1">
          @if (toast.title) {
            <p class="text-sm font-semibold text-gray-900">{{ toast.title }}</p>
          }
          <p class="text-sm text-gray-700">{{ toast.message }}</p>
        </div>

        <button
          type="button"
          aria-label="Cerrar notificación"
          (click)="dismiss(toast.id)"
          class="rounded-md p-1 text-gray-400 transition hover:bg-(--hover-overlay) hover:text-gray-600"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    }
  </div>
}
