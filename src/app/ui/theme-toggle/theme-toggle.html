<app-button variant="ghost"
  [ariaLabel]="dark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  [title]="dark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  extraClass="!h-9 !w-9 !rounded-full !border !border-gray-200 !p-0 text-gray-500 hover:bg-gray-100 hover:text-black"
  (clicked)="toggle()">
  @if (dark()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m13.5-6.5l-1.4 1.4M7.9 16.1l-1.4 1.4m0-11.4l1.4 1.4m8.2 8.2l1.4 1.4M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
  }
</app-button>
