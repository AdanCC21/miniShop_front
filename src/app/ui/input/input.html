<div>
  @if (label()) {
    <label [for]="id()" class="mb-1 block text-sm font-medium text-gray-700">{{ label() }}</label>
  }
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    class="w-full rounded-lg border border-gray-300 bg-(--card) px-3 py-2 text-sm text-gray-900 outline-none transition focus:border-(--primary) disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-400"
  />
</div>
