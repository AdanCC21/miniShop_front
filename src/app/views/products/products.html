<div class="space-y-6" animate.enter="ms-fade-in-up">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-black">{{ storeName }}</h1>
      <p class="text-sm text-gray-500">{{ visibleProducts().length }} productos</p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <app-select
        label="Categoría"
        [value]="selectedCategory()"
        [options]="categoryOptions()"
        (valueChange)="onCategoryChange($event)"
      />
      <app-select
        label="Ordenar"
        [value]="sortBy()"
        [options]="sortOptions"
        (valueChange)="onSortChange($event)"
      />
    </div>
  </div>

  <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (product of visibleProducts(); track product.code; let i = $index) {
      <app-product-card
        animate.enter="ms-card-in"
        [style.--index]="i"
        [name]="product.name"
        [categories]="product.categories"
        [code]="product.code"
        [price]="product.price"
      />
    }
  </section>
</div>
