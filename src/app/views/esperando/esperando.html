<div class="relative flex min-h-screen items-center justify-center bg-(--surface) px-4" animate.enter="ms-fade-in-up">
  <div class="absolute right-4 top-4 z-10">
    <app-theme-toggle />
  </div>
  <div class="w-full max-w-md rounded-lg border border-gray-200 bg-(--card) p-8 text-center shadow-sm">
    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-(--secondary)">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-(--secondary-foreground)" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <h1 class="text-xl font-bold text-black">Esperando autorización del encargado</h1>
    <p class="mt-3 text-sm text-gray-500">
      Tu cuenta fue creada, pero aún no ha sido aceptada por el encargado de la tiendita.
      Una vez que te aprueben podrás acceder a la plataforma.
    </p>
    @if (user(); as user) {
      <p class="mt-4 text-xs text-gray-400">
        {{ user.name }} · {{ user.email }}
      </p>
    }
    <div class="mt-6">
      <app-button variant="outline" extraClass="w-full" text="Cerrar sesión" (clicked)="logout()" />
    </div>
  </div>
</div>
