<label class="flex flex-col gap-2 text-sm font-medium text-gray-500">
  @if (label()) {
    <span>{{ label() }}</span>
  }
  <select
    class="rounded-md border border-gray-200 bg-(--card) px-3 py-2 text-sm font-normal text-black shadow-sm focus:outline-none focus:ring-2 focus:ring-(--primary)"
    [value]="value()"
    (change)="onChange($event)"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</label>
